# Gera o APK do JVM Ensaios a cada alteração enviada ao GitHub.
#
# - push / pull request / execução manual -> APK de teste (debug) em "Artifacts"
# - tag v* (ex.: v6.1.0)                   -> também publica o APK em "Releases"
#
# Segredos (Settings > Secrets and variables > Actions), todos opcionais:
#   DEBUG_KEYSTORE_BASE64    debug.keystore em base64. Sem ele cada execução usa
#                            uma chave nova e o APK não instala por cima do anterior.
#   RELEASE_KEYSTORE_BASE64  chave de publicação (.jks) em base64
#   STORE_PASSWORD / KEY_PASSWORD  senhas da chave de publicação (alias "upload")
#   Com os três segredos de publicação, o APK release assinado também é gerado.

name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publicar o APK em Releases nas tags

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # versionCode/versionName automáticos pela data/hora do build (mesma regra dos builds locais:
      # minutos desde 01/01/2026), então o APK mais novo sempre atualiza o anterior.
      # Numa tag v* (ex.: v6.2.0) o nome da versão passa a ser o da tag.
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Arquivo criado pelo Android Studio que exige JDK 25 para o Gradle
      - name: Usar o JDK 21 do runner
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: Chave de debug
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            echo "::warning::Segredo DEBUG_KEYSTORE_BASE64 ausente: usando chave temporária (o APK não atualiza versões anteriores)."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Gerar APK debug
        run: gradle assembleDebug --console=plain

      - name: Gerar APK release (se houver chave de publicação)
        id: release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Sem chave de publicação: só o APK debug foi gerado."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/upload-key.jks" gradle assembleRelease --console=plain
          rm -f "$RUNNER_TEMP/upload-key.jks"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Renomear APKs
        id: names
        run: |
          mkdir -p dist
          # versão gerada no build (app/build.gradle.kts)
          NAME=$(jq -r '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          CODE=$(jq -r '.elements[0].versionCode' app/build/outputs/apk/debug/output-metadata.json)
          echo "Versão $NAME (código $CODE)"
          echo "version=$NAME" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/jvm-ensaios-${NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/jvm-ensaios-${NAME}.apk"
          fi
          ls -la dist

      - name: Publicar em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jvm-ensaios-${{ steps.names.outputs.version }}
          path: dist/*.apk
          retention-days: 30

      - name: Publicar em Releases (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
